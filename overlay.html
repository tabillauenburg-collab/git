<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHANTOM - Persistent Overlay (FOV & AC Banner)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            background-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            position: relative;
            pointer-events: none;
        }

        /* ===================================================
           1. AC DETECTION BADGE (LEICHT ABGERUNDETE VIERECKIGE BOX)
           =================================================== */
        .ac-badge {
            position: fixed;
            left: 50%;
            top: 72%;
            transform: translateX(-50%);
            background: rgba(13, 15, 20, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 4px; /* leicht abgerundet */
            padding: 7px 18px;
            display: flex;
            align-items: center;
            gap: 9px;
            box-shadow: 0 4px 22px rgba(0, 0, 0, 0.85);
            z-index: 10000;
            pointer-events: none;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.35px;
            color: #e2e8f0;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .ac-badge.detected {
            border-color: rgba(239, 68, 68, 0.65);
            background: rgba(24, 12, 16, 0.96);
            box-shadow: 0 4px 22px rgba(239, 68, 68, 0.32);
        }

        .ac-badge.detected #ac-badge-dot {
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        .ac-badge.clean {
            border-color: rgba(34, 197, 94, 0.5);
            background: rgba(10, 20, 15, 0.96);
            box-shadow: 0 4px 22px rgba(34, 197, 94, 0.25);
        }

        .ac-badge.clean #ac-badge-dot {
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        .ac-badge-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 6px #22c55e;
            flex-shrink: 0;
        }

        /* ===================================================
           2. NUI FOV CIRCLE OVERLAY (HAUCHDÜNNER PERFEKTER KREIS)
           =================================================== */
        #fov-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 500;
        }
    </style>
</head>
<body>
    <!-- AC Detection Badge (Mitte, etwas weiter unten) -->
    <div id="ac-badge" class="ac-badge" style="display: flex;">
        <div class="ac-badge-dot" id="ac-badge-dot"></div>
        <span id="ac-badge-text">No AC detected</span>
    </div>

    <!-- NUI FOV Circle Overlay (Haardünner SVG Kreis genau in der Bildschirmmitte) -->
    <div id="fov-overlay" style="display: none;">
        <svg width="100%" height="100%" style="position: absolute; top: 0; left: 0;">
            <circle id="fov-circle" cx="50%" cy="50%" r="85" fill="none" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.1" />
        </svg>
    </div>

    <script>
        function updateAcBadge(acData) {
            const badgeEl = document.getElementById("ac-badge");
            const textEl = document.getElementById("ac-badge-text");
            if (!badgeEl || !textEl) return;

            if (acData && acData.visible === false) {
                badgeEl.style.display = "none";
                return;
            }

            badgeEl.style.display = "flex";
            textEl.textContent = (acData && acData.text) ? acData.text : "No AC detected";

            if (acData && acData.detected) {
                badgeEl.className = "ac-badge detected";
            } else {
                badgeEl.className = "ac-badge clean";
            }
        }

        function updateFovOverlay(fovData) {
            const fovEl = document.getElementById("fov-overlay");
            const circleEl = document.getElementById("fov-circle");
            if (!fovEl || !circleEl) return;

            if (!fovData || !fovData.visible) {
                fovEl.style.display = "none";
                return;
            }

            fovEl.style.display = "block";
            const r = fovData.radius || 85;
            circleEl.setAttribute("r", r);
            if (fovData.color) {
                circleEl.setAttribute("stroke", fovData.color);
            }
            if (fovData.width) {
                circleEl.setAttribute("stroke-width", fovData.width);
            }
        }

        // Nachrichten von FiveM Lua
        window.addEventListener("message", function(event) {
            let data = event.data;
            if (!data) return;

            if (typeof data === "string") {
                try {
                    data = JSON.parse(data);
                } catch(e) {
                    return;
                }
            }
            if (!data) return;

            if (data.action === "updateFov") {
                updateFovOverlay(data.fov || data);
            } else if (data.action === "updateAc") {
                updateAcBadge(data.acBanner || data);
            } else if (data.action === "sync") {
                if (data.acBanner !== undefined) {
                    updateAcBadge(data.acBanner);
                }
                if (data.fov !== undefined) {
                    updateFovOverlay(data.fov);
                }
            }
        });
    </script>
</body>
</html>
