<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHANTOM Menu - NUI / CEF</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 30px;
        }

        /* Haupt-Container mit 1:1 Vanity Look */
        #menu-container {
            width: 440px;
            background: linear-gradient(180deg, #121316 0%, #0a0b0d 100%);
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.12);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Metallischer Banner mit Carbon-Raster & 3D Viper/Phantom Logo */
        .banner {
            height: 140px;
            position: relative;
            background: radial-gradient(circle at 50% 20%, #2a2e36 0%, #16181c 65%, #0f1013 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Feines Carbon-Raster im Banner */
        .banner-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 16px 16px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            pointer-events: none;
        }

        /* Glanz-Lichtreflexion auf der oberen Banner-Hälfte */
        .banner-gloss {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
        }

        .banner-content {
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 2;
        }

        /* Chrome Viper Emblem SVG */
        .banner-emblem {
            width: 58px;
            height: 58px;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.9));
        }

        /* 3D Metallischer Chrom-Schriftzug "PHANTOM" */
        .banner-title {
            font-size: 40px;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #d8dde6 30%, #8b92a0 70%, #525866 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.9));
        }

        /* Sub-Header mit Breadcrumb-Titel (z. B. "Combat Options") */
        .sub-header {
            background: #08090b;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-align: center;
            padding: 9px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }

        /* Haupt-Inhaltsbereich mit linker Scrollbar */
        .content-wrapper {
            display: flex;
            position: relative;
            min-height: 240px;
            max-height: 480px;
            background: #0d0e11;
        }

        /* Linke Scrollbar (exakt wie im Vanity Screenshot) */
        .scrollbar-left {
            width: 22px;
            background: rgba(0, 0, 0, 0.25);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            position: relative;
        }

        .scroll-arrow {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            line-height: 1;
        }

        .scroll-track {
            position: absolute;
            top: 24px;
            bottom: 24px;
            width: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
        }

        .scroll-thumb {
            position: absolute;
            width: 4px;
            background: #8b92a0;
            border-radius: 2px;
            transition: top 0.1s ease, height 0.1s ease;
        }

        /* Item-Liste */
        .item-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Einzelne Zeile */
        .menu-row {
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            color: #d1d5db;
            font-size: 14.5px;
            font-weight: 500;
            position: relative;
            transition: background 0.1s ease, color 0.1s ease;
        }

        /* Aktive / Selektierte Zeile (Vanity Highlight Gradient) */
        .menu-row.selected {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.18) 50%, rgba(255, 255, 255, 0.06) 100%);
            color: #ffffff;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), inset 0 -1px 0 rgba(255, 255, 255, 0.25);
        }

        .row-left {
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1;
        }

        .row-right {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1;
        }

        /* Submenu Chevron Arrow */
        .chevron {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
        }

        .menu-row.selected .chevron {
            color: #ffffff;
        }

        /* Pill Switch (Toggle) */
        .pill-switch {
            width: 42px;
            height: 22px;
            background: #252830;
            border-radius: 11px;
            position: relative;
            transition: background 0.2s ease;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
        }

        .pill-switch.active {
            background: #4a5160;
        }

        .pill-knob {
            width: 18px;
            height: 18px;
            background: #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        .pill-switch.active .pill-knob {
            transform: translateX(20px);
        }

        /* Slider */
        .slider-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slider-value {
            font-size: 13.5px;
            color: #9ca3af;
            min-width: 44px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .menu-row.selected .slider-value {
            color: #ffffff;
        }

        .slider-track {
            width: 86px;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            position: relative;
        }

        .slider-fill {
            height: 100%;
            background: #8b92a0;
            border-radius: 2px;
        }

        .slider-thumb {
            width: 10px;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
            position: absolute;
            top: -3px;
            transform: translateX(-50%);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        /* Divider / Trennzeile mit Text (z. B. "─── Other ───") */
        .menu-divider {
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 16px;
        }

        .divider-line {
            position: absolute;
            left: 16px;
            right: 16px;
            height: 1px;
            background: rgba(255, 255, 255, 0.12);
        }

        .divider-text {
            position: relative;
            background: #0d0e11;
            padding: 0 12px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
            text-transform: capitalize;
        }

        /* Footer */
        .footer {
            height: 32px;
            background: #08090b;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
        }

        .footer-left {
            letter-spacing: 0.3px;
        }

        .footer-right {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <div id="menu-container">
        <!-- Banner -->
        <div class="banner">
            <div class="banner-grid"></div>
            <div class="banner-gloss"></div>
            <div class="banner-content">
                <!-- 3D Viper / Phantom Emblem -->
                <svg class="banner-emblem" viewBox="0 0 100 100">
                    <defs>
                        <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="35%" stop-color="#d0d5dd"/>
                            <stop offset="70%" stop-color="#7a8291"/>
                            <stop offset="100%" stop-color="#3c414d"/>
                        </linearGradient>
                        <linearGradient id="innerShade" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#2d313b"/>
                            <stop offset="100%" stop-color="#14161a"/>
                        </linearGradient>
                    </defs>
                    <!-- Äußeres V-Schild -->
                    <polygon points="50,92 12,24 28,14 50,60 72,14 88,24" fill="url(#chromeGrad)"/>
                    <polygon points="50,82 22,26 32,20 50,54 68,20 78,26" fill="url(#innerShade)"/>
                    <!-- Viper Kopf Silhouette -->
                    <path d="M50,22 Q66,22 72,36 Q64,48 50,56 Q36,48 28,36 Q34,22 50,22 Z" fill="url(#chromeGrad)"/>
                    <!-- Viper Augen -->
                    <polygon points="42,34 46,38 41,40" fill="#0d0e11"/>
                    <polygon points="58,34 54,38 59,40" fill="#0d0e11"/>
                </svg>
                <div class="banner-title" id="banner-title">PHANTOM</div>
            </div>
        </div>

        <!-- Sub-Header / Breadcrumbs -->
        <div class="sub-header" id="sub-header">Combat Options</div>

        <!-- Inhaltsbereich mit Scrollbar -->
        <div class="content-wrapper">
            <!-- Linke Scrollbar -->
            <div class="scrollbar-left">
                <span class="scroll-arrow">&#9650;</span>
                <div class="scroll-track">
                    <div class="scroll-thumb" id="scroll-thumb"></div>
                </div>
                <span class="scroll-arrow">&#9660;</span>
            </div>

            <!-- Liste der Optionen -->
            <div class="item-list" id="item-list"></div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span class="footer-left" id="footer-left">Build 49488 | discord.gg/phantommenu</span>
            <span class="footer-right" id="footer-right">1 / 8</span>
        </div>
    </div>

    <script>
        // Menü-Zustand
        let state = {
            title: "Combat Options",
            footerLeft: "Build 49488 | discord.gg/phantommenu",
            selectedIndex: 0,
            items: [
                { type: "submenu", label: "Aimbot" },
                { type: "submenu", label: "Silent Aim" },
                { type: "submenu", label: "Rage Bot" },
                { type: "submenu", label: "Trigger Bot" },
                { type: "divider", label: "Other" },
                { type: "toggle", label: "One Punch", value: false },
                { type: "toggle", label: "Fast Punch", value: false },
                { type: "toggle", label: "Punch Mode", value: false }
            ]
        };

        const itemListEl = document.getElementById("item-list");
        const subHeaderEl = document.getElementById("sub-header");
        const footerLeftEl = document.getElementById("footer-left");
        const footerRightEl = document.getElementById("footer-right");
        const scrollThumbEl = document.getElementById("scroll-thumb");

        // Zeichnet das Menü neu
        function render() {
            subHeaderEl.textContent = state.title;
            footerLeftEl.textContent = state.footerLeft;

            const selectableItems = state.items.filter(it => it.type !== "divider");
            const totalSelectable = selectableItems.length;
            const currentSelectableIndex = selectableItems.indexOf(state.items[state.selectedIndex]);

            footerRightEl.textContent = `${(currentSelectableIndex >= 0 ? currentSelectableIndex + 1 : 1)} / ${totalSelectable}`;

            // Update Scrollbar Thumb
            if (totalSelectable > 1) {
                const percent = currentSelectableIndex / (totalSelectable - 1);
                const thumbHeight = Math.max(20, 100 / totalSelectable);
                scrollThumbEl.style.height = `${thumbHeight}%`;
                scrollThumbEl.style.top = `${percent * (100 - thumbHeight)}%`;
            } else {
                scrollThumbEl.style.height = "100%";
                scrollThumbEl.style.top = "0%";
            }

            itemListEl.innerHTML = "";

            state.items.forEach((item, index) => {
                if (item.type === "divider") {
                    const div = document.createElement("div");
                    div.className = "menu-divider";
                    div.innerHTML = `
                        <div class="divider-line"></div>
                        <div class="divider-text">${item.label}</div>
                    `;
                    itemListEl.appendChild(div);
                    return;
                }

                const row = document.createElement("div");
                row.className = `menu-row ${index === state.selectedIndex ? "selected" : ""}`;

                let rightHtml = "";
                if (item.type === "submenu") {
                    rightHtml = `<span class="chevron">&#8250;</span>`;
                } else if (item.type === "toggle") {
                    rightHtml = `
                        <div class="pill-switch ${item.value ? "active" : ""}">
                            <div class="pill-knob"></div>
                        </div>
                    `;
                } else if (item.type === "slider") {
                    const min = item.min || 0;
                    const max = item.max || 100;
                    const val = item.value || min;
                    const pct = Math.min(100, Math.max(0, ((val - min) / (max - min)) * 100));
                    rightHtml = `
                        <div class="slider-wrapper">
                            <span class="slider-value">${item.format ? item.format : val}</span>
                            <div class="slider-track">
                                <div class="slider-fill" style="width: ${pct}%"></div>
                                <div class="slider-thumb" style="left: ${pct}%"></div>
                            </div>
                        </div>
                    `;
                }

                row.innerHTML = `
                    <div class="row-left">
                        <span>${item.label}</span>
                    </div>
                    <div class="row-right">
                        ${rightHtml}
                    </div>
                `;

                itemListEl.appendChild(row);
            });
        }

        // Nachricht von Lua via SendDuiMessage
        window.addEventListener("message", function(event) {
            const data = event.data;
            if (!data) return;

            if (data.action === "sync") {
                state = Object.assign(state, data.state);
                render();
            } else if (data.action === "setIndex") {
                state.selectedIndex = data.index;
                render();
            } else if (data.action === "updateItem") {
                if (state.items[data.index]) {
                    state.items[data.index] = Object.assign(state.items[data.index], data.item);
                    render();
                }
            }
        });

        // Tastaturbedienung für Standalone-Test im Browser
        window.addEventListener("keydown", function(e) {
            const len = state.items.length;
            if (e.key === "ArrowDown") {
                let next = (state.selectedIndex + 1) % len;
                while (state.items[next] && state.items[next].type === "divider") {
                    next = (next + 1) % len;
                }
                state.selectedIndex = next;
                render();
            } else if (e.key === "ArrowUp") {
                let prev = (state.selectedIndex - 1 + len) % len;
                while (state.items[prev] && state.items[prev].type === "divider") {
                    prev = (prev - 1 + len) % len;
                }
                state.selectedIndex = prev;
                render();
            } else if (e.key === "Enter") {
                const cur = state.items[state.selectedIndex];
                if (cur && cur.type === "toggle") {
                    cur.value = !cur.value;
                    render();
                }
            } else if (e.key === "ArrowLeft") {
                const cur = state.items[state.selectedIndex];
                if (cur && cur.type === "slider") {
                    const step = cur.step || 1;
                    cur.value = Math.max(cur.min || 0, (cur.value || 0) - step);
                    render();
                }
            } else if (e.key === "ArrowRight") {
                const cur = state.items[state.selectedIndex];
                if (cur && cur.type === "slider") {
                    const step = cur.step || 1;
                    cur.value = Math.min(cur.max || 100, (cur.value || 0) + step);
                    render();
                }
            }
        });

        // Erstes Rendering beim Laden
        render();
    </script>
</body>
</html>
