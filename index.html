<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHANTOM Menu - NUI / CEF</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            width: 900px;
            height: 1300px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 18px;
        }

        /* Haupt-Container mit 1:1 Vanity Look (Groß skaliert für perfekte Lesbarkeit) */
        #menu-container {
            width: 864px;
            background: linear-gradient(180deg, #121316 0%, #0a0b0d 100%);
            border-radius: 22px;
            box-shadow: 0 26px 70px rgba(0, 0, 0, 0.95), 0 0 0 2px rgba(255, 255, 255, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Metallischer Banner mit Carbon-Raster & 3D Viper/Phantom Logo */
        .banner {
            height: 230px;
            position: relative;
            background: radial-gradient(circle at 50% 20%, #313742 0%, #17191e 65%, #0f1013 100%);
            border-bottom: 2px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Feines Carbon-Raster im Banner */
        .banner-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 26px 26px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.038) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.038) 1px, transparent 1px);
            pointer-events: none;
        }

        /* Glanz-Lichtreflexion auf der oberen Banner-Hälfte */
        .banner-gloss {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 52%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
        }

        .banner-content {
            display: flex;
            align-items: center;
            gap: 26px;
            z-index: 2;
        }

        /* Chrome Viper Emblem SVG */
        .banner-emblem {
            width: 96px;
            height: 96px;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.95));
        }

        /* 3D Metallischer Chrom-Schriftzug "PHANTOM" */
        .banner-title {
            font-size: 66px;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #d8dde6 30%, #8b92a0 70%, #525866 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.95));
        }

        /* Sub-Header mit Breadcrumb-Titel (z. B. "Combat Options") */
        .sub-header {
            background: #08090b;
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-align: center;
            padding: 14px 0;
            border-bottom: 2px solid rgba(255, 255, 255, 0.08);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        }

        /* Haupt-Inhaltsbereich mit linker Scrollbar */
        .content-wrapper {
            display: flex;
            position: relative;
            min-height: 400px;
            background: #0d0e11;
        }

        /* Linke Scrollbar (exakt wie im Vanity Screenshot) */
        .scrollbar-left {
            width: 38px;
            background: rgba(0, 0, 0, 0.32);
            border-right: 1px solid rgba(255, 255, 255, 0.07);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            position: relative;
        }

        .scroll-arrow {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1;
        }

        .scroll-track {
            position: absolute;
            top: 36px;
            bottom: 36px;
            width: 7px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .scroll-thumb {
            position: absolute;
            width: 7px;
            background: #9ca3af;
            border-radius: 4px;
            transition: top 0.1s ease, height 0.1s ease;
        }

        /* Item-Liste */
        .item-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            max-height: 850px;
        }
        .item-list::-webkit-scrollbar {
            display: none;
        }

        /* Einzelne Zeile */
        .menu-row {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            color: #d1d5db;
            font-size: 24px;
            font-weight: 500;
            position: relative;
            transition: background 0.12s ease, color 0.12s ease;
        }

        /* Aktive / Selektierte Zeile (Vanity Highlight Gradient) */
        .menu-row.selected {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.24) 50%, rgba(255, 255, 255, 0.08) 100%);
            color: #ffffff;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), inset 0 -1px 0 rgba(255, 255, 255, 0.35);
        }

        .row-left {
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 1;
        }

        .row-right {
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 1;
        }

        /* Submenu Chevron Arrow */
        .chevron {
            font-size: 26px;
            color: rgba(255, 255, 255, 0.55);
            font-weight: 700;
        }

        .menu-row.selected .chevron {
            color: #ffffff;
        }

        /* Pill Switch (Toggle) */
        .pill-switch {
            width: 66px;
            height: 36px;
            background: #252830;
            border-radius: 18px;
            position: relative;
            transition: background 0.22s ease, box-shadow 0.22s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.7);
        }

        /* Aktiver Toggle (Hellere Kapsel & leuchtender Schalterknopf) */
        .pill-switch.active {
            background: #4f5869 !important;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4), 0 0 14px rgba(255, 255, 255, 0.3) !important;
        }

        .pill-knob {
            width: 30px;
            height: 30px;
            background: #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
        }

        .pill-switch.active .pill-knob {
            transform: translateX(30px) !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.9) !important;
        }

        /* Slider */
        .slider-wrapper {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .slider-value {
            font-size: 22px;
            color: #9ca3af;
            min-width: 68px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .menu-row.selected .slider-value {
            color: #ffffff;
        }

        .slider-track {
            width: 140px;
            height: 7px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            position: relative;
        }

        .slider-fill {
            height: 100%;
            background: #9ca3af;
            border-radius: 4px;
        }

        .slider-thumb {
            width: 16px;
            height: 16px;
            background: #ffffff;
            border-radius: 50%;
            position: absolute;
            top: -4.5px;
            transform: translateX(-50%);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
        }

        /* Divider / Trennzeile mit Text (z. B. "─── Other ───") */
        .menu-divider {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 28px;
        }

        .divider-line {
            position: absolute;
            left: 28px;
            right: 28px;
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
        }

        .divider-text {
            position: relative;
            background: #0d0e11;
            padding: 0 18px;
            font-size: 19px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.6px;
            text-transform: capitalize;
        }

        /* Footer */
        .footer {
            height: 52px;
            background: #08090b;
            border-top: 2px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            font-size: 19px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
        }

        .footer-left {
            letter-spacing: 0.4px;
        }

        .footer-right {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <div id="menu-container">
        <!-- Banner -->
        <div class="banner">
            <div class="banner-grid"></div>
            <div class="banner-gloss"></div>
            <div class="banner-content">
                <!-- 3D Viper / Phantom Emblem -->
                <svg class="banner-emblem" viewBox="0 0 100 100">
                    <defs>
                        <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="35%" stop-color="#d0d5dd"/>
                            <stop offset="70%" stop-color="#7a8291"/>
                            <stop offset="100%" stop-color="#3c414d"/>
                        </linearGradient>
                        <linearGradient id="innerShade" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#2d313b"/>
                            <stop offset="100%" stop-color="#14161a"/>
                        </linearGradient>
                    </defs>
                    <!-- Äußeres V-Schild -->
                    <polygon points="50,92 12,24 28,14 50,60 72,14 88,24" fill="url(#chromeGrad)"/>
                    <polygon points="50,82 22,26 32,20 50,54 68,20 78,26" fill="url(#innerShade)"/>
                    <!-- Viper Kopf Silhouette -->
                    <path d="M50,22 Q66,22 72,36 Q64,48 50,56 Q36,48 28,36 Q34,22 50,22 Z" fill="url(#chromeGrad)"/>
                    <!-- Viper Augen -->
                    <polygon points="42,34 46,38 41,40" fill="#0d0e11"/>
                    <polygon points="58,34 54,38 59,40" fill="#0d0e11"/>
                </svg>
                <div class="banner-title" id="banner-title">PHANTOM</div>
            </div>
        </div>

        <!-- Sub-Header / Breadcrumbs -->
        <div class="sub-header" id="sub-header">PHANTOM</div>

        <!-- Inhaltsbereich mit Scrollbar -->
        <div class="content-wrapper">
            <!-- Linke Scrollbar -->
            <div class="scrollbar-left">
                <span class="scroll-arrow">&#9650;</span>
                <div class="scroll-track">
                    <div class="scroll-thumb" id="scroll-thumb"></div>
                </div>
                <span class="scroll-arrow">&#9660;</span>
            </div>

            <!-- Liste der Optionen -->
            <div class="item-list" id="item-list"></div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span class="footer-left" id="footer-left">Build 49488 | discord.gg/phantommenu</span>
            <span class="footer-right" id="footer-right">1 / 1</span>
        </div>
    </div>

    <script>
        // Initialer Zustand (wird sofort von Lua überschrieben, keine Dummy-Daten mehr!)
        let state = {
            title: "PHANTOM",
            footerLeft: "Build 49488 | discord.gg/phantommenu",
            selectedIndex: 0,
            items: []
        };

        const itemListEl = document.getElementById("item-list");
        const subHeaderEl = document.getElementById("sub-header");
        const footerLeftEl = document.getElementById("footer-left");
        const footerRightEl = document.getElementById("footer-right");
        const scrollThumbEl = document.getElementById("scroll-thumb");

        // Zeichnet das Menü neu
        function render() {
            if (!state || !state.items) return;

            subHeaderEl.textContent = state.title || "PHANTOM";
            footerLeftEl.textContent = state.footerLeft || "Build 49488 | discord.gg/phantommenu";

            const selectableItems = state.items.filter(it => it.type !== "divider");
            const totalSelectable = selectableItems.length;
            const currentItem = state.items[state.selectedIndex];
            const currentSelectableIndex = currentItem ? selectableItems.indexOf(currentItem) : 0;

            footerRightEl.textContent = `${(currentSelectableIndex >= 0 ? currentSelectableIndex + 1 : 1)} / ${Math.max(1, totalSelectable)}`;

            // Update Scrollbar Thumb
            if (totalSelectable > 1) {
                const percent = Math.max(0, currentSelectableIndex) / Math.max(1, totalSelectable - 1);
                const thumbHeight = Math.max(20, 100 / totalSelectable);
                scrollThumbEl.style.height = `${thumbHeight}%`;
                scrollThumbEl.style.top = `${percent * (100 - thumbHeight)}%`;
            } else {
                scrollThumbEl.style.height = "100%";
                scrollThumbEl.style.top = "0%";
            }

            itemListEl.innerHTML = "";

            state.items.forEach((item, index) => {
                if (item.type === "divider") {
                    const div = document.createElement("div");
                    div.className = "menu-divider";
                    div.innerHTML = `
                        <div class="divider-line"></div>
                        <div class="divider-text">${item.label || "Other"}</div>
                    `;
                    itemListEl.appendChild(div);
                    return;
                }

                const row = document.createElement("div");
                row.className = `menu-row ${index === state.selectedIndex ? "selected" : ""}`;

                let rightHtml = "";
                if (item.type === "submenu") {
                    rightHtml = `<span class="chevron">&#8250;</span>`;
                } else if (item.type === "toggle") {
                    const isActive = (item.value === true);
                    rightHtml = `
                        <div class="pill-switch ${isActive ? "active" : ""}">
                            <div class="pill-knob"></div>
                        </div>
                    `;
                } else if (item.type === "slider") {
                    const min = item.min || 0;
                    const max = item.max || 100;
                    const val = item.value || min;
                    const pct = Math.min(100, Math.max(0, ((val - min) / Math.max(1, (max - min))) * 100));
                    rightHtml = `
                        <div class="slider-wrapper">
                            <span class="slider-value">${item.format ? item.format : val}</span>
                            <div class="slider-track">
                                <div class="slider-fill" style="width: ${pct}%"></div>
                                <div class="slider-thumb" style="left: ${pct}%"></div>
                            </div>
                        </div>
                    `;
                }

                row.innerHTML = `
                    <div class="row-left">
                        <span>${item.label}</span>
                    </div>
                    <div class="row-right">
                        ${rightHtml}
                    </div>
                `;

                itemListEl.appendChild(row);
            });

            // Ausgewählte Zeile immer ins Blickfeld scrollen
            const activeRow = itemListEl.querySelector(".menu-row.selected");
            if (activeRow) {
                activeRow.scrollIntoView({ block: "nearest", behavior: "auto" });
            }
        }

        // Nachricht von Lua via SendDuiMessage
        window.addEventListener("message", function(event) {
            let data = event.data;
            if (!data) return;

            // In FiveM CEF / DUI kommt der Payload oft als serialisierter JSON-String
            if (typeof data === "string") {
                try {
                    data = JSON.parse(data);
                } catch(e) {
                    return;
                }
            }
            if (!data) return;

            if (data.action === "sync") {
                if (data.state) {
                    state = Object.assign(state, data.state);
                    render();
                }
            } else if (data.action === "setIndex") {
                state.selectedIndex = data.index;
                render();
            }
        });

        // Erstes Rendering beim Laden
        render();
    </script>
</body>
</html>
